name = "aifred-site"
pages_build_output_dir = "apps/website"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]



[vars]
AIFRED_ADMIN_USERNAME = "North3rnLight3r"
AIFRED_ADMIN_PASSWORD = ""
AIFRED_ADMIN_PASSWORD_SHA256 = "a82a47b7c18616ff0420d53b4f46b1015f173e38b5d2718c992bee7fc826ddb3"
AIFRED_ADMIN_SESSION_SECRET = "supersecretadminsessionkey"
AIFRED_PUBLIC_ORIGIN = "https://north3rnlight3r.com"
AIFRED_API_BASE_URL = "https://north3rnlight3r.com"
AIFRED_GITHUB_REPO = "kaeganscott26/AIFRED_Official-"
AIFRED_GITHUB_BRANCH = "main"
AIFRED_PAGES_PROJECT = "aifred-site"
AIFRED_CONTACT_EMAIL = "north3rnlight3rofficial@outlook.com"
AIFRED_ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "AIFRED_REFERENCE_POOL"
id = "8a120701767e474f928d1af7037cd68a"

[[kv_namespaces]]
# Historical compatibility only. The unified backend never writes request events here.
binding = "AIFRED_SALES_LOG"
id = "2c66da7795b54135a4d67e514b97491f"

[[r2_buckets]]
binding = "AIFRED_DOWNLOADS"
bucket_name = "aifred-downloads"

[[r2_buckets]]
binding = "AIFRED_REFERENCE_BUCKET"
bucket_name = "aifred-reference-pool"

[[d1_databases]]
binding = "AIFRED_OPS"
database_name = "aifred-ops"
database_id = "60d95cd8-d1da-486c-b6fd-4bfedcd7bc47"

[[analytics_engine_datasets]]
binding = "AIFRED_ANALYTICS"
dataset = "aifred_events"

[env.preview.vars]
AIFRED_PUBLIC_ORIGIN = "https://north3rnlight3r.com"
AIFRED_API_BASE_URL = "https://north3rnlight3r.com"
AIFRED_GITHUB_REPO = "kaeganscott26/AIFRED_Official-"
AIFRED_GITHUB_BRANCH = "main"
AIFRED_PAGES_PROJECT = "aifred-site"
AIFRED_CONTACT_EMAIL = "north3rnlight3rofficial@outlook.com"
AIFRED_ENVIRONMENT = "preview"

[[env.preview.kv_namespaces]]
binding = "AIFRED_REFERENCE_POOL"
id = "8a120701767e474f928d1af7037cd68a"

[[env.preview.kv_namespaces]]
binding = "AIFRED_SALES_LOG"
id = "2c66da7795b54135a4d67e514b97491f"

[[env.preview.r2_buckets]]
binding = "AIFRED_DOWNLOADS"
bucket_name = "aifred-downloads"

[[env.preview.r2_buckets]]
binding = "AIFRED_REFERENCE_BUCKET"
bucket_name = "aifred-reference-pool"

[[env.preview.d1_databases]]
binding = "AIFRED_OPS"
# The canonical reference pool already lives here; do not clone its contents.
database_name = "aifred-ops"
database_id = "60d95cd8-d1da-486c-b6fd-4bfedcd7bc47"

[[env.preview.analytics_engine_datasets]]
binding = "AIFRED_ANALYTICS"
dataset = "aifred_events_preview"
